<div class="w-[275px] h-[64px] flex flex-col gap-2">

  <label
    class="font-['Rubik']
           font-bold
           text-[15px]
           leading-[18px]
           text-black"
  >
    {{ label() }}
  </label>

  <div class="relative w-[275px] h-[41px]">

    <input
      [type]="showPassword() ? 'text' : 'password'"
      placeholder="••••••••"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onTouched()"
      class="w-full
             h-full
             bg-[#FFE9E9]
             border-2
             border-[#450979]
             rounded-[4px]
             pl-3
             pr-10
             font-['Rubik']
             text-[13px]
             leading-[15px]
             text-[#4A335D]
             focus:outline-none"
    />

    <button
      type="button"
      (click)="toggleShow()"
      class="absolute
             right-2.5
             top-1/2
             -translate-y-1/2
             text-[#0F172A]
             flex
             items-center
             justify-center
             p-1"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
        />

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
        />
      </svg>
    </button>

  </div>

</div>
